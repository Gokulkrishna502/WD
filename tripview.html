<!DOCTYPE html>
<html>
<head>
    <title>Event Website</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: url("https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3")
                        center/cover;
        }

        .box {
            text-align: center;
            padding: 40px;
            width: 60%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            color: white;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
        }

        .explore {
            background: transparent;
            color: rgb(63, 56, 56);
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to Our Event</h1>
        

        <p>Join us for an amazing experience and unforgettable moments!</p>

        <button>Register Now</button>
        <button class="explore">Explore Event</button>
    </div>

</body>
</html>
