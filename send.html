<div class="trip">

    <h1>🌍 My Trip</h1>

    <input
        type="text"
        id="name"
        placeholder="Your Name"
    >

    <input
        type="text"
        id="destination"
        placeholder="Destination"
    >

    <input
        type="date"
        id="date"
    >

    <textarea
        id="message"
        placeholder="Enter your trip details"
    ></textarea>

    <button id="sendButton" onclick="sendData()">
        Send
    </button>

    <p id="result"></p>

</div>


<script>

    // =====================================================
    // SUPABASE SETTINGS
    // =====================================================

    const supabaseUrl = "YOUR_SUPABASE_URL";

    const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

    const supabaseClient = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


    // =====================================================
    // EMAILJS SETTINGS
    // =====================================================

    emailjs.init({
        publicKey: "YOUR_EMAILJS_PUBLIC_KEY"
    });


    // =====================================================
    // SEND DATA FUNCTION
    // =====================================================

    async function sendData() {

        // Get values from form

        const name = document
            .getElementById("name")
            .value
            .trim();

        const destination = document
            .getElementById("destination")
            .value
            .trim();

        const date = document
            .getElementById("date")
            .value;

        const message = document
            .getElementById("message")
            .value
            .trim();


        const result = document.getElementById("result");

        const button = document.getElementById("sendButton");


        // =================================================
        // CHECK EMPTY FIELDS
        // =================================================

        if (
            name === "" ||
            destination === "" ||
            date === "" ||
            message === ""
        ) {

            result.innerText =
                "⚠️ Please fill all the fields.";

            result.style.color = "red";

            return;
        }


        // =================================================
        // SHOW SENDING MESSAGE
        // =================================================

        result.innerText = "⏳ Sending...";

        result.style.color = "black";

        button.disabled = true;


        // =================================================
        // SAVE DATA TO SUPABASE
        // =================================================

        try {

            const { error } = await supabaseClient
                .from("trip_data")
                .insert([
                    {
                        name: name,
                        destination: destination,
                        date: date,
                        message: message
                    }
                ]);


            // Check database error

            if (error) {

                console.error("Supabase Error:", error);

                result.innerText =
                    "❌ Database error. Data was not saved.";

                result.style.color = "red";

                button.disabled = false;

                return;
            }


            // =================================================
            // EMAILJS DATA
            // =================================================

            const templateParams = {

                name: name,

                destination: destination,

                date: date,

                message: message,

                to_email: "gokulakrishna502@gmail.com"
            };


            // =================================================
            // SEND EMAIL
            // =================================================

            await emailjs.send(

                "YOUR_SERVICE_ID",

                "YOUR_TEMPLATE_ID",

                templateParams

            );


            // =================================================
            // SUCCESS
            // =================================================

            result.innerText =
                "✅ Trip saved and sent to your email!";

            result.style.color = "green";


            // =================================================
            // CLEAR FORM
            // =================================================

            document.getElementById("name").value = "";

            document.getElementById("destination").value = "";

            document.getElementById("date").value = "";

            document.getElementById("message").value = "";


        }

        catch (error) {

            console.error("EmailJS Error:", error);

            result.innerText =
                "⚠️ Trip saved, but email could not be sent.";

            result.style.color = "orange";

        }


        // Enable button again

        button.disabled = false;

    }

</script>
