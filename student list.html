<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Name List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 5px;
            color: #222;
        }

        .details {
            color: #666;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .professional-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .professional-list li {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            transition: 0.3s;
        }

        .professional-list li:hover {
            background-color: #eef4ff;
            transform: translateX(5px);
        }

        .number {
            font-weight: bold;
            color: #2563eb;
            margin-right: 15px;
            min-width: 25px;
        }

        .item {
            color: #333;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

            </li>

            <li>

                <span class="item">Student Name 5</span>
            </li>

        </ul>

    </div>

</body>
</html>
