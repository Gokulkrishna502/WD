<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card</title>

    <style>
        body {
            background-color: #e8f0fe;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .id-card {
            width: 320px;
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header {
            background-color: #1565c0;
            color: white;
            padding: 15px;
            border-radius: 10px;
        }

        .photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto 10px;
            display: block;
            border: 4px solid #1565c0;
            object-fit: cover;
        }

        h2 {
            margin: 10px 0 5px;
            color: #222;
        }

        p {
            margin: 8px;
            color: #555;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details strong {
            color: #1565c0;
        }

        .footer {
            margin-top: 20px;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="id-card">

        <div class="header">
            <h2>VSB ENGINEERING COLLEGE</h2>
            <p style="color:white;">STUDENT ID CARD</p>
        </div>

        <img src="photo.jpg" alt="Student Photo" class="photo">

        <h2>Gokulakrishna N</h2>
        <p><strong>ECE Student</strong></p>

        <div class="details">
            <p><strong>ID:</strong> ECE2026XXX</p>
            <p><strong>Department:</strong> Electronics & Communication</p>
            <p><strong>Year:</strong> Pre-Final Year</p>
            <p><strong>Phone:</strong> 9876543210</p>
        </div>

        <div class="footer">
            <b>Valid Until: 2027</b>
        </div>

    </div>

</body>
</html>
